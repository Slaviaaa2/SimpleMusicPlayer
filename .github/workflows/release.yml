name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\SimpleMusicPlayer.csproj

      - name: Publish
        run: dotnet publish .\SimpleMusicPlayer.csproj -c Release -r win-x64 --self-contained false -o .\publish

      - name: Archive release
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "manual-build" }
          $archiveName = "SimpleMusicPlayer-$version-win-x64.zip"
          Compress-Archive -Path .\publish\* -DestinationPath ".\$archiveName" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-music-player-win-x64
          path: SimpleMusicPlayer-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SimpleMusicPlayer-*.zip
